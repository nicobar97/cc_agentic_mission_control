<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mission Control</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%23ff8a3d%22/><circle cx=%2212%22 cy=%2212%22 r=%223.2%22 fill=%22%2317171a%22/><ellipse cx=%2212%22 cy=%2212%22 rx=%228.5%22 ry=%223.8%22 transform=%22rotate(-28 12 12)%22 fill=%22none%22 stroke=%22%2317171a%22 stroke-width=%221.6%22/></svg>" />
    <script>
      // theme before first paint: ?theme= wins, then the tracker's saved choice
      try {
        var th = new URLSearchParams(location.search).get("theme") || localStorage.getItem("tracker-theme");
        if (th === "light" || th === "dark" || th === "dim") document.documentElement.dataset.theme = th;
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
